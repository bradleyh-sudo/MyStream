<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Shows</title>
<meta name="description" content="Track the TV shows I'm watching, where they stream, and which episodes I've seen.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Shows">
<meta name="theme-color" content="#14161c">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2314161c'/%3E%3Crect x='30' y='48' width='120' height='80' rx='12' fill='none' stroke='%23f5b942' stroke-width='10'/%3E%3Cpath d='M70 150h40M90 128v22' stroke='%23f5b942' stroke-width='10' stroke-linecap='round'/%3E%3Cpath d='M78 72l28 16-28 16z' fill='%23f5b942'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f3f0; --surface:#ffffff; --surface2:#ecebe7; --text:#17181c; --muted:#6b6d75;
  --line:#dddcd7; --accent:#c98a12; --accent-ink:#ffffff; --good:#2f8a4f; --danger:#c0392b;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161c; --surface:#1d2028; --surface2:#262a34; --text:#eceef2; --muted:#9a9eaa;
    --line:#2e323d; --accent:#f5b942; --accent-ink:#1a1406; --good:#5cc27f; --danger:#ff6b5b;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14161c; --surface:#1d2028; --surface2:#262a34; --text:#eceef2; --muted:#9a9eaa;
  --line:#2e323d; --accent:#f5b942; --accent-ink:#1a1406; --good:#5cc27f; --danger:#ff6b5b;
  --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
header.bar h1{font-size:26px;font-weight:750;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);font-weight:650;white-space:nowrap}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.small{height:32px;padding:0 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.icon-btn{width:40px;height:40px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface2);flex:none}
.icon-btn svg{width:20px;height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:550;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg)}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow);text-align:left;width:100%}
.poster{width:56px;height:80px;border-radius:8px;object-fit:cover;background:var(--surface2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;font-weight:700;overflow:hidden}
.card .meta{flex:1;min-width:0}
.card .name{font-weight:650;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc{display:inline-block;font-size:12px;font-weight:650;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--text);margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.svc.none{color:var(--muted);font-weight:500}
.next{font-size:14px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next b{color:var(--text);font-weight:600}
.progress{height:4px;border-radius:4px;background:var(--surface2);margin-top:8px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:13px;font-weight:650;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.seen{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.left{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--text)}
.air{font-size:14px;margin-top:3px}
.air b{font-weight:600}
.air.muted{color:var(--muted)}
.section-label .n{font-weight:500;opacity:.8}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 8px}
.svc{display:inline-flex;align-items:center;gap:6px}
.svc-ico{display:inline-flex;align-items:center;justify-content:center;border-radius:22%;font-weight:800;letter-spacing:-.03em;flex:none;line-height:1}
.svc-row{display:flex;gap:8px;align-items:center}
.svc-row input{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.stat .big{font-size:24px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .lbl{font-size:13px;font-weight:600}
.stat .sm{font-size:12px;color:var(--muted)}
.bottom-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.bottom-actions .btn{height:48px}
body.has-tabs{padding-bottom:calc(env(safe-area-inset-bottom) + 84px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:4px;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 16px calc(env(safe-area-inset-bottom) + 6px)}
.tabs[hidden]{display:none}
.tabs button{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:10px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--accent)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chip.prov{display:inline-flex;align-items:center;gap:6px}
.chip.prov img{width:20px;height:20px;border-radius:5px}
.chips.sorts{padding-top:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{text-align:left;min-width:0}
.tile .art{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:28px;font-weight:700}
.tile .art img{width:100%;height:100%;object-fit:cover;display:block}
.tile .rank{position:absolute;left:6px;top:6px;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tile .have-old{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:999px;background:var(--good);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tile .tt{font-size:14px;font-weight:600;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ty{font-size:12px;color:var(--muted)}
.btn.more{display:flex;margin:18px auto 0}
.credit{font-size:11px;color:var(--muted);text-align:center;margin:28px 0 8px}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.setup h2{font-size:19px;margin-bottom:6px}
.setup ol{margin:10px 0 14px 20px;display:flex;flex-direction:column;gap:6px}
.setup p{margin-bottom:8px}
a{color:var(--accent)}
.sheet{max-height:88vh;overflow-y:auto}
.content{display:flex;flex-direction:column;gap:12px}
.detail{display:flex;gap:14px}
.detail .poster{width:92px;height:138px;border-radius:10px}
.detail h3{font-size:20px;line-height:1.2;margin-bottom:4px}
.where{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pv{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:var(--surface2);padding:3px 9px 3px 3px;border-radius:999px}
.pv img{width:22px;height:22px;border-radius:6px}
.overview{font-size:15px;line-height:1.5;color:var(--text)!important}
.card.movie{cursor:pointer}
.card.movie .check{margin-right:4px}
.card.movie.seen .check{background:var(--good);border-color:var(--good);color:#fff}
.card.movie.seen .check svg{opacity:1}
.card.movie.seen .name{color:var(--muted)}
.toolbar{display:flex;align-items:flex-start;gap:10px}
.toolbar .chips{flex:1;min-width:0}
.seg.mini{flex:none;margin:0;padding:2px;border-radius:10px}
.seg.mini button{width:38px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.seg.mini svg{width:18px;height:18px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:6px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:15px;cursor:pointer}
.row:last-child{border-bottom:0}
.row .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.row .code{color:var(--muted);font-weight:500;font-size:13px;margin-left:8px;font-variant-numeric:tabular-nums}
.row .rs{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.row .rs b{color:var(--text);font-weight:650}
.row .rs .ok{color:var(--good);font-weight:700}
.row .rw{flex:none;font-size:13px;color:var(--muted);width:62px;text-align:right;font-variant-numeric:tabular-nums}
.row .rw.soon{color:var(--accent);font-weight:600}
.row.seen .rn{color:var(--muted);text-decoration:line-through}
.check.sm{width:26px;height:26px}
.check.sm svg{width:13px;height:13px}
.row.seen .check{background:var(--good);border-color:var(--good);color:#fff}
.row.seen .check svg{opacity:1}
.section-label.with-cols{display:flex;align-items:baseline;gap:6px}
.section-label .cols{margin-left:auto;display:flex;font-size:11px;padding-right:13px}
.section-label .cols span:first-child{min-width:44px;text-align:right}
.section-label .cols span:last-child{width:72px;text-align:right}
.star{flex:none;width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.star svg{width:22px;height:22px;fill:none;stroke:currentColor}
.star.on{color:var(--accent)}
.star.on svg{fill:currentColor}
.star.sm{width:30px;height:30px;margin-right:-6px}
.star.sm svg{width:18px;height:18px}
.card .star{align-self:flex-start}
.card{cursor:pointer}
.tile{cursor:pointer}
.tile .star{position:absolute;right:5px;top:5px;width:34px;height:34px;background:rgba(0,0,0,.55);color:#fff}
.tile .star.on{color:#f5b942}
.tile .star.busy svg{animation:spin 1s linear infinite;opacity:.7}
.banner{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 6px 10px 14px;margin:2px 0 12px;font-size:14px;box-shadow:var(--shadow)}
.banner span{flex:1}
.banner .x{color:var(--muted);height:32px;padding:0 8px}
.acct{display:flex;flex-direction:column;gap:10px}
.acct .field input{height:46px;font-size:17px}
.linkish{color:var(--accent);font-weight:600;padding:6px;font-size:15px}
.err.okmsg{color:var(--good)}
.sheet h3+p{margin-top:-4px}
.heart-mark{display:inline-flex;vertical-align:-2px;margin-left:6px;color:#e0465a}
.heart-mark svg{width:15px;height:15px;fill:currentColor;stroke:currentColor}
.pill.fav{background:color-mix(in srgb,#e0465a 16%,transparent);color:#e0465a}
.fav-btn svg{fill:none;stroke:currentColor}
.fav-btn.on{color:#e0465a}
.fav-btn.on svg{fill:currentColor}
.fav-toggle svg{fill:none;stroke:currentColor}
.fav-toggle.on{color:#e0465a}
.fav-toggle.on svg{fill:currentColor}
.section-label.fav-label{display:flex;align-items:center;gap:6px}
.section-label .pick{margin-left:auto;text-transform:none;letter-spacing:0;height:30px;font-size:13px;color:var(--text)}
.pickep{font-size:16px;margin:6px 0 8px}
.result .acts{display:flex;align-items:center;gap:2px;flex:none}
.heart{flex:none;width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.heart svg{width:22px;height:22px;fill:none;stroke:currentColor}
.heart.on{color:#e0465a}
.heart.on svg{fill:currentColor}
.heart.busy svg,.star.busy svg{animation:spin 1s linear infinite;opacity:.7}
.summary-text{font-size:15px;line-height:1.5;margin:-4px 0 4px}
.summary-text.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{padding:0 0 12px}
.hero .svc{align-self:flex-start}
.profile-actions{display:flex;flex-direction:column;gap:10px;margin:8px 0 6px}
.profile-actions .btn{height:46px}
.fillsvg{fill:currentColor;stroke:currentColor}
.svc-row select{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:16px;color:var(--text)}
.svc-row select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.svc-other{display:flex;gap:8px;margin-top:8px}
.svc-other[hidden]{display:none}
.svc-other input{flex:1;min-width:0;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:16px}
.tile .heart{position:absolute;right:5px;bottom:5px;width:34px;height:34px;background:rgba(0,0,0,.55);color:#fff}
.tile .heart.on{color:#ff5c72}
.chip .cn{opacity:.6;font-weight:500;margin-left:2px}
.chip.add-cat{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.favrows .row{align-items:center;padding:8px 10px;gap:12px;min-height:76px}
.poster.mini{width:40px;height:58px;border-radius:6px;font-size:16px}
.fbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fbody .rn{flex:none}
.fsub{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
.fsub .dot{opacity:.6}
.fcats{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.catpill{font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,#e0465a 14%,transparent);color:#c23a4d}
.catbtn{font-size:12px;font-weight:600;color:var(--accent);padding:2px 4px}
.catlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.catopt{display:flex;align-items:center;gap:12px;padding:0 6px 0 14px;min-height:48px;border-bottom:1px solid var(--line);font-size:16px;cursor:pointer}
.catopt:last-child{border-bottom:0}
.catopt input{width:20px;height:20px;accent-color:var(--accent)}
.catopt span{flex:1}
.catdel{color:var(--muted);width:36px;height:36px;font-size:14px}
.star-btn svg{fill:none;stroke:currentColor}
.star-btn.on{color:var(--accent)}
.star-btn.on svg{fill:currentColor}
.notlisted{text-align:center;margin:0}
.exrows .row{gap:8px}
.exrows .xr{flex:none;width:24px;text-align:right;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.exrows .xs{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.heart.sm{width:30px;height:30px}
.heart.sm svg{width:18px;height:18px}
.chips.sorts{padding-top:0}
.btn.google{background:var(--surface);color:var(--text);border:1px solid var(--line);height:46px;gap:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.listsw{display:flex;align-items:center;gap:8px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 12px;text-align:left;box-shadow:var(--shadow)}
.listsw svg{width:20px;height:20px;flex:none;color:var(--accent)}
.listsw .ln{font-weight:700}
.listsw .lsub{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listsw .dd{margin-left:auto;color:var(--muted)}
.lrow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lpick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 14px;text-align:left}
.lpick svg{width:22px;height:22px;flex:none;color:var(--accent)}
.lt{flex:1;min-width:0;display:flex;flex-direction:column}
.lt .ln{font-weight:650}
.lt .lsub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcheck{color:var(--accent);font-weight:800}
.lmanage{font-size:14px;font-weight:600;color:var(--accent);padding:0 14px;height:44px}
.lcrow{display:flex;align-items:center;gap:12px;width:100%;padding:0 14px;min-height:52px;border-bottom:1px solid var(--line);text-align:left;font-size:16px}
.lcrow:last-child{border-bottom:0}
.lcrow svg{width:22px;height:22px;color:var(--accent)}
.lcrow .ln{flex:1;font-weight:600}
.lcrow .lcst{font-size:14px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.lcrow.on .lcst{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.linkbox{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;font-size:14px;color:var(--text)}
.members{display:flex;flex-direction:column;gap:6px;font-size:15px}
.members div{display:flex;align-items:center;gap:8px}
.joinbox{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.joinbox p{margin:0}
.markall{width:100%;margin:0 0 12px;height:44px}
.markall[hidden]{display:none}
.line-acts{display:flex;align-items:center;align-self:flex-start;gap:0}
.lists-btn{position:relative;flex:none;width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.lists-btn svg{width:21px;height:21px}
.lists-btn.sm{width:30px;height:30px}
.lists-btn.sm svg{width:17px;height:17px}
.lists-btn .lb{position:absolute;right:1px;top:1px;min-width:15px;height:15px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px}
.bulkbar{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;gap:8px;justify-content:center;background:var(--surface);border-top:1px solid var(--line);
  padding:8px 16px calc(env(safe-area-inset-bottom) + 8px);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.bulkbar[hidden]{display:none}
body.has-tabs .bulkbar{bottom:calc(env(safe-area-inset-bottom) + 62px);padding-bottom:8px}
body.has-bulk{padding-bottom:calc(env(safe-area-inset-bottom) + 150px)}
.bb{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:12px;font-size:13px;font-weight:650;color:var(--text);background:var(--surface2)}
.bb svg{width:22px;height:22px}

.selbtn{height:32px}
.selecting [data-show],.selecting [data-movie],.selecting .result{position:relative}
.selbox{flex:none;width:26px;height:26px;border-radius:999px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;background:var(--surface)}

.results-head{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:-4px 0 10px;font-size:14px;color:var(--muted);font-weight:600}
.results-head span{margin-right:auto}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;align-self:flex-start;padding-top:2px}
.empty{text-align:center;color:var(--muted);padding:56px 16px}
.empty h2{color:var(--text);font-size:20px;margin-bottom:6px}
.empty .btn{margin-top:18px}
.search{display:flex;gap:8px;margin-bottom:14px}
.search input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:17px}

.result .btn{flex:none}
.sub{font-size:14px;color:var(--muted)}
.hero{display:flex;gap:14px;margin:4px 0 16px}

.field label{display:block;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.field input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.season{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.season-head{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;text-align:left}
.season-head .t{flex:1;font-weight:650}

.chev{transition:transform .15s;color:var(--muted);width:18px;height:18px}

.eps{display:none;border-top:1px solid var(--line)}

.season-tools{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}

.ep .body{flex:1;min-width:0}

.ep .date{font-size:13px;color:var(--muted)}

.ep.seen .title{color:var(--muted)}

.ep.seen .check svg{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);z-index:20;
  background:var(--text);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;
  width:calc(100% - 32px);max-width:480px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}

.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:10px}

@keyframes spin{to{transform:rotate(360deg)}}

.err p{color:var(--muted);font-size:14px;margin-top:6px}
.section-label{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
</style>

<body>
<div class="wrap" id="app"></div>
<nav id="tabs" class="tabs" hidden>
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Watching</button>
  <button data-tab="favorites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.6 3.9 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.9 1.2-1.8 2.8-2.9 4.8-2.9 3.3 0 5.6 3.1 4.4 6.6-1.7 4.8-9.2 9.4-9.2 9.4z"/></svg>Favorites</button>
  <button data-tab="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Explore</button>
</nav>
<div id="bulkBar" class="bulkbar" hidden></div>
<div id="overlay"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
(() => {
"use strict";

/* ---------- storage ---------- */
const KEY = "myshows-v1";
const STALE_MS = 12 * 60 * 60 * 1000; // refresh episode lists twice a day at most
let db = wireDb(loadDb());
function loadDb() {
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && (v.shows || v.lists)) return v; } catch {}
  return {};
}
// Lists: db.lists.me is your own list; any other key is a shared list (its database id).
// db.shows / db.movies / db.favCategories always point at the list you're looking at (db.active).
function wireDb(d) {
  d = d || {};
  if (!d.lists) {   // older single-list format -> "My list"
    d.lists = { me: { shows: d.shows || {}, movies: d.movies || {} } };
    if (d.favCategories) d.lists.me.favCategories = d.favCategories;
    d.sync = { me: { sig: d.dirty ? "" : null, dirty: !!d.dirty } };   // null = assume in sync
    delete d.shows; delete d.movies; delete d.favCategories; delete d.syncedSig; delete d.dirty;
  }
  d.sync = d.sync || {};
  d.lists.me = d.lists.me || {};
  for (const L of Object.values(d.lists)) { L.shows = L.shows || {}; L.movies = L.movies || {}; normalizeListServices(L); }
  if (!d.lists[d.active]) d.active = "me";
  for (const k of ["shows", "movies", "favCategories"])
    Object.defineProperty(d, k, { configurable: true, enumerable: false,
      get() { return d.lists[d.active][k]; }, set(v) { d.lists[d.active][k] = v; } });
  return d;
}
// Run fn with another list temporarily active (screens redraw once afterwards).
let listOverride = 0, refreshPending = false;
function withList(key, fn) {
  if (!key || key === db.active || !db.lists[key]) return fn();
  const prev = db.active; db.active = key; listOverride++;
  try { return fn(); }
  finally { db.active = prev; listOverride--; if (!listOverride && refreshPending) { refreshPending = false; refresh(); } }
}
const listKeys = () => ["me", ...Object.keys(db.lists).filter(k => k !== "me").sort((a, b) => listName(a).localeCompare(listName(b)))];
const multiList = () => Object.keys(db.lists).length > 1;
const listName = k => k === "me" ? "My list" : (db.lists[k] && db.lists[k].name) || "Shared list";
function writeLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast("Couldn't save — storage is full or blocked."); }
}
function saveDb() {
  writeLocal();
  if (typeof onLocalChange === "function") onLocalChange();
}

/* ---------- TVMaze API (free, no key) ---------- */
const API = "https://api.tvmaze.com";
class NetError extends Error {}
const sleep = ms => new Promise(res => setTimeout(res, ms));
const apiTimes = [];
async function apiSlot() {   // at most 16 requests in any 10 seconds
  for (;;) {
    const now = Date.now();
    while (apiTimes.length && now - apiTimes[0] > 10000) apiTimes.shift();
    if (apiTimes.length < 16) { apiTimes.push(now); return; }
    await sleep(10000 - (now - apiTimes[0]) + 50);
  }
}
async function api(path, tries = 0) {
  await apiSlot();
  let r;
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 15000);
    r = await fetch(API + path, { signal: ctl.signal });
    clearTimeout(timer);
  } catch (e) {
    throw new NetError(e && e.name === "AbortError" ? "timeout" : "blocked");
  }
  if (r.status === 429 && tries < 6) { await sleep(2000 * (tries + 1)); return api(path, tries + 1); }
  if (!r.ok) throw new Error("TVMaze returned " + r.status);
  return r.json();
}
const serviceOf = s => normalizeService((s.webChannel && s.webChannel.name) || (s.network && s.network.name) || "");
// One name per service: every HBO/Max variant is "HBO Max"; drop "Amazon Channel" / "with Ads" variants.
function normalizeService(name) {
  if (!name) return name || "";
  const n = String(name).trim().replace(/\s+(Amazon|Apple TV|Roku Premium) Channel$/i, "").replace(/\s+(Standard |Basic )?with Ads$/i, "");
  return /^(hbo\b.*|max)$/i.test(n) ? "HBO Max" : n;
}
function normalizeListServices(L) {
  for (const x of [...Object.values(L.shows || {}), ...Object.values(L.movies || {})]) {
    if (x.service) x.service = normalizeService(x.service);
    if (x.defaultService) x.defaultService = normalizeService(x.defaultService);
  }
}
function slimEpisodes(list) {
  return (list || []).map(e => ({
    id: e.id, s: e.season, n: e.number, name: e.name || "TBA",
    date: e.airdate || "", stamp: e.airstamp || "", special: e.number == null || e.type === "significant_special" || e.type === "insignificant_special"
  }));
}
const plainText = html => html ? (new DOMParser().parseFromString(html, "text/html").body.textContent || "").trim() : "";
async function fetchShow(id) {
  const s = await api(`/shows/${id}?embed=episodes`);
  return {
    name: s.name,
    image: s.image ? (s.image.medium || s.image.original) : "",
    status: s.status || "",
    year: (s.premiered || "").slice(0, 4),
    ended: (s.ended || "").slice(0, 4),
    summary: plainText(s.summary),
    genres: s.genres || [],
    rating: (s.rating && s.rating.average) || null,
    runtime: s.runtime || s.averageRuntime || null,
    defaultService: serviceOf(s),
    episodes: slimEpisodes(s._embedded && s._embedded.episodes),
    fetchedAt: Date.now()
  };
}
async function refreshShow(id, force) {
  const show = db.shows[id];
  if (!show) return false;
  if (!force && show.fetchedAt && Date.now() - show.fetchedAt < STALE_MS) return false;
  const fresh = await fetchShow(id);
  Object.assign(db.shows[id], fresh); // keeps service + watched
  saveDb();
  return true;
}

/* ---------- helpers ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const aired = e => {
  if (e.stamp) return new Date(e.stamp).getTime() <= Date.now();
  return !!e.date && e.date <= today();
};
const code = e => e.n == null ? `S${e.s} Special` : `S${e.s}E${e.n}`;
const fmtDate = d => d ? new Date(d + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "Date TBA";
const regularEps = show => show.episodes.filter(e => !e.special);
function stats(show) {
  const w = show.watched || {};
  const reg = regularEps(show);
  const airedReg = reg.filter(aired);
  const seen = airedReg.filter(e => w[e.id]).length;
  const next = airedReg.find(e => !w[e.id]);
  const upcoming = reg.find(e => !aired(e)); // next new episode to come out
  return { total: airedReg.length, seen, next, upcoming, remaining: airedReg.length - seen,
           everWatched: Object.keys(w).length > 0 };
}
function posterHtml(img, name, cls = "poster") {
  return img ? `<img class="${cls}" src="${esc(img)}" alt="" loading="lazy">`
             : `<div class="${cls}">${esc((name || "?").trim().charAt(0).toUpperCase())}</div>`;
}
const ICON = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  person: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
  people: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2c3 .2 5 2.4 5 5.3"/></svg>',
  heart: '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.6 3.9 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.9 1.2-1.8 2.8-2.9 4.8-2.9 3.3 0 5.6 3.1 4.4 6.6-1.7 4.8-9.2 9.4-9.2 9.4z"/></svg>',
  dice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/></svg>',
  star: '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linejoin="round"><path d="M12 3.3l2.7 5.5 6 .9-4.35 4.2 1.03 6L12 17.05 6.62 19.9l1.03-6L3.3 9.7l6-.9z"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
};

/* ---------- service badges (simple colored monograms, not official logos) ---------- */
const SERVICE_STYLE = [
  [/netflix/i, "N", "#d81f26"], [/hulu/i, "h", "#1ce783", "#0b0c0f"], [/^max$|hbo/i, "h", "#002be7"],
  [/disney/i, "D+", "#0b2a6f"], [/prime|amazon/i, "a", "#00a8e1"], [/apple/i, "tv", "#000000"],
  [/peacock/i, "P", "#5a2ca0"], [/paramount|cbs/i, "P+", "#0064ff"], [/youtube/i, "▶", "#ff0000"],
  [/fx/i, "FX", "#222222"], [/amc/i, "A", "#111111"], [/starz/i, "S", "#111111"], [/showtime/i, "S", "#b10000"],
  [/abc/i, "abc", "#111111"], [/nbc/i, "N", "#5a2ca0"], [/fox/i, "F", "#003a70"], [/pbs/i, "P", "#2638c4"],
  [/bbc/i, "B", "#111111"], [/crunchyroll/i, "C", "#f47521"], [/cable|live/i, "TV", "#555b66"]
];
function serviceIcon(name, size = 22) {
  if (!name) return `<span class="svc-ico" style="width:${size}px;height:${size}px;background:var(--surface2);color:var(--muted)">?</span>`;
  let m = SERVICE_STYLE.find(([re]) => re.test(name));
  if (!m) {
    let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    m = [null, name.trim().charAt(0).toUpperCase(), `hsl(${h % 360} 55% 38%)`];
  }
  const [, label, bg, fg = "#fff"] = m;
  const fs = Math.round(size * (label.length > 2 ? .36 : label.length > 1 ? .44 : .58));
  return `<span class="svc-ico" aria-hidden="true" style="width:${size}px;height:${size}px;background:${bg};color:${fg};font-size:${fs}px">${esc(label)}</span>`;
}

// Which lists is this on? Shown on each line of Watching when you have more than one list.
function listsBtn(kind, id, label, extra = "") {
  if (!multiList()) return "";
  const n = listKeys().filter(k => isListed((db.lists[k][kind === "show" ? "shows" : "movies"] || {})[id])).length;
  return `<button class="lists-btn ${extra}" data-lists aria-label="Lists for ${esc(label)}">${ICON.people}${n > 1 ? `<span class="lb">${n}</span>` : ""}</button>`;
}
// Put a show/movie from the current list onto another list too (starts with nothing checked there).
function copyToList(kind, id, key) {
  const src = storeOf(kind)[id]; if (!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  withList(key, () => {
    const store = storeOf(kind), cur = store[id];
    if (cur) cur.listed = true;
    else store[id] = { ...copy, listed: true, fav: false, favCats: [], watched: kind === "show" ? {} : undefined,
                       lastWatchedAt: undefined, addedAt: Date.now(), ...(kind === "movie" ? { watched: false } : {}) };
    saveDb();
  });
}
function openLineLists(kind, id) {
  const it = storeOf(kind)[id]; if (!it) return;
  openListChooser({ name: it.name || it.title, which: "listed",
    find: () => storeOf(kind)[id] ? { kind, id: Number(id) } : null,
    add: async k => copyToList(kind, id, k) });
}
function starBtn(on, label, extra = "") {
  return `<button class="star ${on ? "on" : ""} ${extra}" data-star aria-pressed="${on}" aria-label="${on ? "Remove " + esc(label) + " from Watching" : "Add " + esc(label) + " to Watching"}">${ICON.star}</button>`;
}
function viewToggleHtml(textView) {
  return `<div class="seg mini" role="group" aria-label="View">
      <button data-view="cards" class="${textView ? "" : "on"}" aria-label="Cards view" title="Cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></svg></button>
      <button data-view="text" class="${textView ? "on" : ""}" aria-label="Text view" title="Text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg></button>
    </div>`;
}
function heartBtn(on, label, extra = "") {
  return `<button class="heart ${on ? "on" : ""} ${extra}" data-heart aria-pressed="${on}" aria-label="${on ? "Remove " + esc(label) + " from favorites" : "Add " + esc(label) + " to favorites"}">${ICON.heart}</button>`;
}
// A show/movie can be on the Watching list, in Favorites, or both.
const isListed = x => !!x && x.listed !== false;
const storeOf = kind => kind === "show" ? db.shows : (db.movies = db.movies || {});
// Take it off Watching (with Undo). Favorites keep it; otherwise it's deleted.
function removeItem(kind, id) {
  const store = storeOf(kind), it = store[id];
  if (!it) return;
  const name = it.name || it.title;
  if (it.fav) {
    it.listed = false; saveDb(); refresh();
    return toast(`Removed ${name} from Watching. It's still in Favorites.`, "Undo", () => { it.listed = true; saveDb(); refresh(); });
  }
  delete store[id]; saveDb(); refresh();
  toast(`Removed ${name}.`, "Undo", () => { store[id] = it; saveDb(); refresh(); });
}
function addToWatching(kind, id) {
  const it = storeOf(kind)[id]; if (!it) return;
  it.listed = true; saveDb(); refresh(); toast(`Added ${it.name || it.title} to Watching.`);
}
// Favorite on/off. Un-favoriting something that isn't on Watching deletes it (with Undo).
function setFav(kind, id, on) {
  const store = storeOf(kind), it = store[id];
  if (!it) return;
  const name = it.name || it.title;
  if (on) { it.fav = true; saveDb(); refresh(); return favToast(kind, id); }
  if (!isListed(it)) { delete store[id]; saveDb(); refresh(); }
  else { it.fav = false; saveDb(); refresh(); }
  toast(`${name} removed from Favorites.`, "Undo", () => { store[id] = it; it.fav = true; saveDb(); refresh(); });
}
function refresh() {
  if (listOverride) { refreshPending = true; return; }
  const h = location.hash.replace(/^#\/?/, "");
  if (h === "explore") drawExploreGrid();
  else if (h === "favorites") renderFavorites();
  else if (h === "add") { if (lastResults) drawResults(lastResults); }
  else if (!h || h === "/") renderHome();
  else {
    const m = h.match(/^show\/(\d+)$/);

function airLabel(e) {
  if (!e.date) return "date not announced yet";
  const d = new Date(e.date + "T12:00:00"), now = new Date();
  const days = Math.round((new Date(e.date + "T00:00:00") - new Date(today() + "T00:00:00")) / 86400000);
  if (days === 0) return "today";
  if (days === 1) return "tomorrow";
  const opts = { weekday: "short", month: "short", day: "numeric" };
  if (d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined, opts) + (days < 7 ? ` (in ${days} days)` : "");
}

let refreshing = false, refreshAgain = false;
async function backgroundRefresh() {
  if (refreshing) { refreshAgain = true; return; }
  refreshing = true;
  let changed = false;
  do {
    refreshAgain = false;
    for (const id of Object.keys(db.shows)) {
      try { if (await refreshShow(id)) { changed = true; await sleep(900); } } catch {}
    }
  } while (refreshAgain);
  refreshing = false;
  if (changed) refreshQuiet();
}

function netProblem(e) {
  if (!navigator.onLine) return `<b>You're offline.</b><p>Connect to the internet and try again.</p>`;
  if (e instanceof NetError && e.message === "timeout") return `<b>The show database didn't answer.</b><p>It may be busy. Try again in a minute.</p>`;
  if (e instanceof NetError) return `<b>This page isn't allowed to go online from where it's open.</b>
    <p>Searching needs to reach the show database (tvmaze.com). Previews (inside the Claude app, email, or the Files app)
    block that. Open the page in Safari or Chrome instead, or from its web address once it's hosted.</p>`;
  return `<b>Search failed.</b><p>${esc(e.message || "Unknown error")}. Try again in a minute.</p>`;
}

let searchSeq = 0;
async function search(text) {
  text = text.trim();
  lastQuery = text;
  const out = $("#results");
  if (!text) { out.innerHTML = ""; lastResults = null; return; }
  const seq = ++searchSeq;
  out.innerHTML = `<div class="spinner"></div>`;
  try {
    const res = await api(`/search/shows?q=${encodeURIComponent(text)}`);
    if (seq !== searchSeq) return;
    lastResults = res.map(r => r.show);
    drawResults(lastResults);
  } catch (e) {
    if (seq !== searchSeq) return;
    out.innerHTML = `<div class="err">${netProblem(e)}</div>`;
  }
}

// Add/remove/favorite a TVMaze show without leaving the page.
const adding = new Set();
// opts: { listed: put on Watching, fav: put in Favorites }
async function addTvMaze(id, opts = {}, listKey) {
  id = Number(id);
  const cur = withList(listKey, () => db.shows[id]);
  if (cur) { if (opts.fav) cur.fav = true; if (opts.listed) cur.listed = true; saveDb(); return cur; }
  const data = previewCache[id] || cachedShowData(id) || await fetchShow(id);
  return withList(listKey, () => {
    db.shows[id] = { id, service: data.defaultService, watched: {}, addedAt: Date.now(), ...JSON.parse(JSON.stringify(data)), fav: !!opts.fav, listed: !!opts.listed };
    saveDb();
    return db.shows[id];
  });
}
function cachedShowData(id) {
  for (const L of Object.values(db.lists)) {
    const sh = (L.shows || {})[id];
    if (sh && sh.episodes && sh.episodes.length && sh.fetchedAt) {
      const out = { name: sh.name, image: sh.image, status: sh.status, year: sh.year };
      for (const f of CACHE_FIELDS) if (sh[f] !== undefined) out[f] = sh[f];
      return JSON.parse(JSON.stringify(out));
    }
  }
  return null;
}
const showNameFor = id => ((lastResults || []).find(s => s.id == id) || db.shows[id] || previewCache[id] || {}).name || "This show";
// Star/heart when you have more than one list: ask which list(s).
// which: "listed" (Watching) or "fav" (Favorites); find(): {kind,id} in the current list or null; add(key): add it to that list.
function openListChooser({ name, which, find, add }) {
  sheet(`<h3>${which === "fav" ? "Add to Favorites on…" : "Add to Watching on…"}</h3><p>${esc(name)}</p><div class="catlist" id="lcRows"></div>`, m => {
    const state = k => withList(k, () => { const e = find(); const it = e && storeOf(e.kind)[e.id]; return { e, on: which === "fav" ? !!(it && it.fav) : isListed(it) }; });
    const draw = () => {
      m.querySelector("#lcRows").innerHTML = listKeys().map(k => { const { on } = state(k); return `
        <button class="lcrow ${on ? "on" : ""}" data-k="${esc(k)}">${k === "me" ? ICON.person : ICON.people}<span class="ln">${esc(listName(k))}</span>
          <span class="lcst">${on ? (which === "fav" ? "♥ Added" : "★ Added") : "Add"}</span></button>`; }).join("");
      m.querySelectorAll("[data-k]").forEach(b => b.onclick = async () => {
        const k = b.dataset.k, { e, on } = state(k);
        b.disabled = true; b.querySelector(".lcst").textContent = "…";
        try {
          if (on) withList(k, () => which === "fav" ? setFav(e.kind, e.id, false) : removeItem(e.kind, e.id));
          else if (e) withList(k, () => which === "fav" ? setFav(e.kind, e.id, true) : addToWatching(e.kind, e.id));
          else await add(k);
        } catch (err) { toast(err && err.message === "notfound" ? `Couldn't find episode info for ${name}.` : "Couldn't add it. Check your connection."); }

}
async function toggleShowInList(id) {
  id = Number(id);
  if (adding.has(id)) return;
  if (multiList()) return openListChooser({ name: showNameFor(id), which: "listed", find: () => db.shows[id] ? { kind: "show", id } : null, add: k => addTvMaze(id, { listed: true }, k) });
  if (isListed(db.shows[id])) return removeItem("show", id);
  if (db.shows[id]) return addToWatching("show", id);
  adding.add(id); refresh();
  try { const s = await addTvMaze(id, { listed: true }); toast(`Added ${s.name} to Watching.`); }
  catch { toast("Couldn't add that show. Check your connection."); }
  adding.delete(id); refresh();
}
async function toggleShowFav(id) {
  id = Number(id);
  if (adding.has(id)) return;
  if (multiList()) return openListChooser({ name: showNameFor(id), which: "fav", find: () => db.shows[id] ? { kind: "show", id } : null, add: k => addTvMaze(id, { fav: true }, k) });
  const s = db.shows[id];
  if (s) return setFav("show", id, !s.fav);

  try { await addTvMaze(id, { fav: true }); favToast("show", id); }
  catch { toast("Couldn't add that show. Check your connection."); }
  adding.delete(id); refresh();
}

function bulkWatched() {

function shortDate(e) {
  if (!e || !e.date) return "";

  return d.toLocaleDateString(undefined, opts);
}

const TMDB = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/";

async function tmdb(path, params = {}) {
  const key = tmdbKey();
  if (!key) throw new Error("nokey");
  const u = new URL(TMDB + path);
  for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== "") u.searchParams.set(k, v);
  const headers = {};
  if (key.startsWith("eyJ")) headers.Authorization = "Bearer " + key; else u.searchParams.set("api_key", key);
  let r;
  try { r = await fetch(u, { headers }); } catch { throw new NetError("blocked"); }
  if (r.status === 401) throw new Error("badkey");
  if (!r.ok) throw new Error("TMDB returned " + r.status);
  return r.json();
}
const MAIN_PROVIDERS = [
  ["Netflix", /^netflix$/i], ["Prime Video", /^amazon prime video$/i], ["Disney+", /^disney( plus|\+)$/i],
  ["HBO Max", /^(hbo )?max$/i], ["Hulu", /^hulu$/i], ["Apple TV+", /^apple tv( plus|\+)?$/i],
  ["Peacock", /^peacock( premium)?( plus)?$/i], ["Paramount+", /^paramount( plus|\+)$/i]
];
const friendlyProvider = name => { const n = normalizeService(name); return (MAIN_PROVIDERS.find(([, re]) => re.test(n)) || [n])[0]; };
const providerCache = {};
async function providers(type) {
  const k = type + "-" + region();
  if (providerCache[k]) return providerCache[k];
  const list = (await tmdb(`/watch/providers/${type}`, { watch_region: region() })).results || [];
  const out = [];
  for (const [label, re] of MAIN_PROVIDERS) {
    const hits = list.filter(p => re.test(p.provider_name.trim()));
    if (hits.length) out.push({ label, ids: hits.map(p => p.provider_id), logo: hits[0].logo_path });
  }
  return (providerCache[k] = out);
}

async function loadExplore(reset) {

    const dateField = ex.type === "tv" ? "first_air_date" : "primary_release_date";
    const params = { watch_region: region(), with_watch_providers: ids.join("|"), with_watch_monetization_types: "flatrate",

// The library entry for a TMDB item (shows added by search are matched by name + year).
function libraryEntry(type, item) {
  if (type === "movie") return (db.movies || {})[item.id] ? { kind: "movie", id: item.id } : null;
  const shows = Object.values(db.shows);
  const name = (item.name || "").toLowerCase(), yr = (item.first_air_date || "").slice(0, 4);
  const s = shows.find(s => s.tmdbId === item.id) || shows.find(s => !s.tmdbId && (s.name || "").toLowerCase() === name && (!yr || !s.year || s.year === yr));
  return s ? { kind: "show", id: s.id } : null;
}

  return ex.prov !== "All" && names.includes(ex.prov) ? ex.prov : names[0] || "";
}

    db.movies = db.movies || {};
    const cur = db.movies[id];
    if (cur) { if (opts.listed) cur.listed = true; if (opts.fav) cur.fav = true; }
    else db.movies[id] = { id: Number(id), title, year, poster: d.poster_path ? IMG + "w185" + d.poster_path : "", service: pickServiceFrom(d), watched: false, addedAt: Date.now(), listed: !!opts.listed, fav: !!opts.fav };

async function toggleStar(type, it) {
  const key = type + "-" + it.id;
  if (starring.has(key)) return;
  if (multiList()) return openListChooser({ name: it.title || it.name, which: "listed", find: () => libraryEntry(type, it), add: k => addFromTmdb(type, it.id, undefined, { listed: true }, k) });
  const entry = libraryEntry(type, it);
  if (entry) return isListed(storeOf(entry.kind)[entry.id]) ? removeItem(entry.kind, entry.id) : addToWatching(entry.kind, entry.id);
  const title = it.title || it.name;
  starring.add(key); drawExploreGrid();
  try {
    await addFromTmdb(type, it.id);
    toast(`Added ${title} to Watching.`);
  } catch (e) {
    toast(e.message === "notfound" ? `Couldn't find episode info for ${title}. Try Add show on the Watching tab.` : `Couldn't add ${title}. Check your connection.`);
  }
  starring.delete(key); drawExploreGrid();
}
const hearting = new Set();
function isFavTmdb(type, it) {
  const e = libraryEntry(type, it);
  return !!(e && (e.kind === "show" ? db.shows[e.id] : db.movies[e.id]).fav);
}
async function toggleHeartTmdb(type, it) {
  const key = type + "-" + it.id;
  if (hearting.has(key) || starring.has(key)) return;
  if (multiList()) return openListChooser({ name: it.title || it.name, which: "fav", find: () => libraryEntry(type, it), add: k => addFromTmdb(type, it.id, undefined, { fav: true }, k) });
  const e = libraryEntry(type, it);
  if (e) return setFav(e.kind, e.id, !storeOf(e.kind)[e.id].fav);
  hearting.add(key); drawExploreGrid();
  try {
    const added = await addFromTmdb(type, it.id, undefined, { fav: true });
    favToast(added.kind, added.id);
  } catch (err) {
    toast(err.message === "notfound" ? `Couldn't find episode info for ${it.title || it.name}.` : `Couldn't add ${it.title || it.name}. Check your connection.`);
  }
  hearting.delete(key); drawExploreGrid();
}
// Episode tracking uses TVMaze; match the TMDB show to it.
async function findOnTvMaze(d, title, year) {
  const ext = d.external_ids || {};
  for (const [k, v] of [["thetvdb", ext.tvdb_id], ["imdb", ext.imdb_id]]) {
    if (!v) continue;
    try { const s = await api(`/lookup/shows?${k}=${encodeURIComponent(v)}`); if (s && s.id) return s.id; }
    catch (e) { if (e instanceof NetError) throw e; }
  }
  const res = await api(`/search/shows?q=${encodeURIComponent(title)}`);
  const hit = res.find(r => (r.show.premiered || "").slice(0, 4) === year) || res[0];
  return hit ? hit.show.id : null;
}

function summaryHtml(show) {
  const w = show.watched || {};
  const reg = regularEps(show);
  const bySeason = new Map();
  for (const e of reg) { if (!bySeason.has(e.s)) bySeason.set(e.s, []); bySeason.get(e.s).push(e); }
  const seasonsDone = [...bySeason.values()].filter(eps => eps.every(e => w[e.id])).length;
  const watched = reg.filter(e => w[e.id]).length;
  const airedLeft = reg.filter(e => aired(e) && !w[e.id]).length;
  const notOut = reg.filter(e => !aired(e)).length;
  const tile = (big, label, sub) => `<div class="stat"><div class="big">${big}</div><div class="lbl">${label}</div><div class="sm">${sub}</div></div>`;
  return tile(bySeason.size, bySeason.size === 1 ? "Season" : "Seasons", `${seasonsDone} finished`)
       + tile(reg.length, reg.length === 1 ? "Episode" : "Episodes", `${watched} watched`)
       + tile(airedLeft, "Left to watch", notOut ? `+${notOut} not out yet` : "all are out");
}
const MAIN_SERVICES = ["Netflix", "Hulu", "HBO Max", "Disney+", "Prime Video", "Apple TV+", "Peacock", "Paramount+", "YouTube", "YouTube TV", "Cable / Live TV"];
const OTHER = "__other__";
function serviceOptions(show) {
  const cur = show.service || "";
  const extra = [...new Set([...Object.values(db.shows), ...Object.values(db.movies || {})].map(x => x.service)
    .concat(show.defaultService || [], cur || []).filter(v => v && !MAIN_SERVICES.includes(v)))].sort((a, b) => a.localeCompare(b));
  const opt = v => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(v)}</option>`;
  return `<option value="" ${cur ? "" : "selected"}>Not set</option>
    <optgroup label="Streaming services">${MAIN_SERVICES.map(opt).join("")}</optgroup>
    ${extra.length ? `<optgroup label="Other services">${extra.map(opt).join("")}</optgroup>` : ""}
    <option value="${OTHER}">Other…</option>`;
}
function seasonHtml(show, n, eps, isOpen) {
  const w = show.watched;
  const airedEps = eps.filter(e => !e.special && aired(e));
  const seen = eps.filter(e => !e.special && w[e.id]).length;
  const done = airedEps.length > 0 && airedEps.every(e => w[e.id]);
  return `<div class="season ${isOpen ? "open" : ""}" data-season="${n}">
    <button class="season-head">${ICON.chev}<span class="t">Season ${n}</span>
      <span class="sub">${done ? `<span style="color:var(--good)">✓ ${seen}/${airedEps.length}</span>` : `${seen}/${airedEps.length}`}</span></button>
    <div class="eps">
      ${airedEps.length ? `<div class="season-tools">
        ${done ? `<button class="btn ghost small" data-season-act="unwatch">Unmark season</button>`
               : `<button class="btn ghost small" data-season-act="watch">Mark season watched</button>`}
      </div>` : ""}
      ${eps.map(e => {
        const fut = !aired(e);
        return `<div class="ep ${w[e.id] ? "seen" : ""} ${fut ? "future" : ""}" data-ep="${e.id}">
          <div class="num">${e.n == null ? "SP" : "E" + e.n}</div>
          <div class="body"><div class="title">${esc(e.name)}</div><div class="date">${fut ? "Airs " : ""}${esc(fmtDate(e.date))}</div></div>
          <button class="check" aria-label="Watched">${ICON.check}</button>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}
function bindSeasons(id) {
  const show = db.shows[id];
  const root = $("#seasons");
  root.querySelectorAll(".season").forEach(sec => {
    const n = Number(sec.dataset.season);
    sec.querySelector(".season-head").onclick = () => {
      sec.classList.toggle("open");
      sec.classList.contains("open") ? openSeasons[id].add(n) : openSeasons[id].delete(n);
    };
    sec.querySelectorAll("[data-season-act]").forEach(b => b.onclick = () => {
      const eps = show.episodes.filter(e => e.s === n && !e.special && aired(e));
      if (b.dataset.seasonAct === "watch") eps.forEach(e => show.watched[e.id] = Date.now());
      else eps.forEach(e => delete show.watched[e.id]);
      show.lastWatchedAt = Date.now();
      saveDb(); redrawSeasons(id);
    });
  });

function deviceId() {

  return db.deviceId;
}
// What gets saved for a list: the list itself, not cached episode guides/profile info (those re-download from TVMaze).
const CACHE_FIELDS = ["episodes", "fetchedAt", "defaultService", "summary", "genres", "rating", "runtime", "ended"];
function listPayload(key) {
  const L = db.lists[key], shows = {};
  for (const [id, sh] of Object.entries(L.shows || {})) {
    const keep = { ...sh }; for (const f of CACHE_FIELDS) delete keep[f];
    shows[id] = keep;
  }
  const out = { shows, movies: L.movies || {}, favCategories: L.favCategories || null };
  if (key === "me") { const st = settings(); out.v = 1; out.settings = { view: st.view, region: st.region, tmdbKey: st.tmdbKey }; }

}
function cloudData() { return { ...listPayload("me"), updatedAt: Date.now(), device: deviceId() }; }
// Short fingerprint of a list, remembered on the device, to tell whether anything changed since the last sync.
function listSig(key) {

  let h = 5381; for (let i = 0; i < str.length; i++) h = (h * 33 ^ str.charCodeAt(i)) >>> 0;

}
const syncOf = key => (db.sync[key] = db.sync[key] || { sig: null, dirty: false });

  for (const [id, sh] of Object.entries(data.shows || {})) {
    const cache = {}; if (old[id]) for (const f of CACHE_FIELDS) if (old[id][f] !== undefined) cache[f] = old[id][f];
    shows[id] = { episodes: [], fetchedAt: 0, ...cache, ...sh };

  L.movies = data.movies || {};
  normalizeListServices(L);
  if (Array.isArray(data.favCategories)) L.favCategories = data.favCategories;
  if (key === "me") {
    const st = settings();
    for (const [k, v] of Object.entries(data.settings || {})) if (v !== undefined && v !== null && v !== "") st[k] = v;

    L.members = data.members || []; L.memberNames = data.memberNames || {}; L.owner = data.owner || "";

// First time this device signs in to an account: combine both copies of My list so nothing is lost.
function mergeLocalInto(cloud) {

  const local = cloudData();
  for (const [id, sh] of Object.entries(local.shows)) {
    if (!out.shows[id]) { out.shows[id] = sh; continue; }
    out.shows[id].watched = { ...(sh.watched || {}), ...(out.shows[id].watched || {}) };
    if (!out.shows[id].service && sh.service) out.shows[id].service = sh.service;
    if (sh.fav) out.shows[id].fav = true;
    if (sh.listed !== false) delete out.shows[id].listed; // on Watching on either device -> on Watching

  }

}
function onLocalChange() {

  let changed = false;
  for (const key of Object.keys(db.lists)) {
    const s = syncOf(key), cur = listSig(key);
    if (s.sig === null) { s.sig = cur; changed = true; continue; }
    if (cur === s.sig) continue;
    s.dirty = true; changed = true;
    if (account.user && backend) schedulePush(key);   // not connected yet: pushed when sign-in finishes
  }

  updateSyncLine();
}
function schedulePush(key, ms = 1200) { clearTimeout(pushTimers[key]); pushTimers[key] = setTimeout(() => pushNow(key), ms); }
async function pushNow(key = "me") {

  account.syncing = true; updateSyncLine();
  try {
    if (key === "me") await backend.save(account.user.uid, cloudData());
    else await backend.saveList(key, { ...listPayload(key), updatedAt: Date.now() });

function onRemote(data) {

}
// Live updates for every shared list you're a member of.
function onLists(docs) {
  const seen = new Set();
  let activeChanged = false;
  for (const { id, data, pending } of docs) {
    seen.add(id);
    const L = db.lists[id];
    if (L) { L.members = data.members || []; L.memberNames = data.memberNames || {}; L.owner = data.owner || ""; }
    if (L && (pending || pushTimers[id] || syncOf(id).dirty)) continue;   // our unsaved edits win
    const before = L ? listSig(id) : "";
    applyListData(id, data);
    if (db.active === id && listSig(id) !== before) activeChanged = true;
  }
  for (const id of Object.keys(db.lists)) if (id !== "me" && !seen.has(id)) {
    const name = listName(id);
    delete db.lists[id]; delete db.sync[id];
    if (db.active === id) { db.active = "me"; activeChanged = true; toast(`You're no longer in "${name}".`); }
  }
  if (pendingActivate && db.lists[pendingActivate]) {
    db.active = pendingActivate; pendingActivate = null; activeChanged = true;
    toast(`Joined "${listName(db.active)}".`); go("/");
  }

  refreshQuiet();

}
async function linkAccount(user) {
  account.user = user; account.error = "";
  try {
    const cloud = await backend.load(user.uid);
    if (db.linkedUid === user.uid) {
      if (syncOf("me").dirty || !cloud) await pushNow("me"); else applyListData("me", cloud);
    } else {
      if (cloud) applyListData("me", mergeLocalInto(cloud));
      db.linkedUid = user.uid; writeLocal();
      await pushNow("me");
    }
    account.lastSync = Date.now();
  } catch (e) {
    account.error = "Couldn't reach your account. Your changes are kept on this device.";
  }
  refreshQuiet(); backgroundRefresh();
  const onErr = () => { account.error = "Lost connection to your account."; updateSyncLine(); };
  if (unwatchMe) unwatchMe();
  unwatchMe = backend.watch(user.uid, onRemote, onErr);
  if (unwatchLists) unwatchLists();
  unwatchLists = backend.watchLists ? backend.watchLists(user.uid, onLists, onErr) : null;
  for (const key of Object.keys(db.lists)) if (key !== "me" && syncOf(key).dirty) schedulePush(key);   // offline edits
}
function syncStatusText() {
  if (account.error) return account.error;
  if (account.syncing || Object.keys(pushTimers).length) return "Saving…";
  if (!account.lastSync) return "Connecting…";
  const mins = Math.round((Date.now() - account.lastSync) / 60000);
  return "All changes saved" + (mins >= 1 ? ` · synced ${mins} min ago` : "");

function updateSyncLine() { const el = $("#syncLine"); if (el) el.textContent = syncStatusText(); }
function refreshQuiet() {
  const h = location.hash.replace(/^#\/?/, "");

}
